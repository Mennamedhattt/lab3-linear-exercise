<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image filters lab: linear and non-linear</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#12263a;--mute:#5b6b7b;--line:#d5dde5;--acc:#0b6e69;--hl:#fde68a;--pad:#e6eaee;--bad:#b42318;--good:#146c43}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212c;--ink:#e6edf3;--mute:#9aa9b8;--line:#2b3a49;--acc:#5fd3cb;--hl:#7a5c00;--pad:#222e3a;--bad:#ff8b7e;--good:#6fdc9f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:30px;margin:8px 0 4px}
h2{font-size:21px;margin:0 0 12px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
button,input{font:inherit;color:var(--ink)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on,button.go{background:var(--acc);border-color:var(--acc);color:var(--card)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:210px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptabs{margin-top:16px;border-bottom:2px solid var(--line);gap:0}
.ptabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 18px;font-weight:600;color:var(--mute);margin-bottom:-2px}
.ptabs button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
.mats{display:flex;flex-wrap:wrap;gap:24px;margin:8px 0}
.mat{border-collapse:separate;border-spacing:3px}
.mat td{width:48px;height:42px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-variant-numeric:tabular-nums}
.mat td.pad{background:var(--pad);color:var(--mute)}
.mat td.c{background:var(--hl);font-weight:600;border-color:var(--ink)}
.cap{font-size:14px;color:var(--mute);margin:0 0 2px}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;font-variant-numeric:tabular-nums}
.ans{font-size:20px;font-weight:600;color:var(--acc)}
.eq{font-size:18px;font-family:Georgia,"Times New Roman",serif;border-left:4px solid var(--acc)}
.eqnote{font-size:13px;color:var(--mute);margin:-4px 0 8px}
.msg{margin-top:8px;font-weight:600}
.ok{color:var(--good)}.no{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Image filters lab</h1>
<p class="mute">Worked examples, then one pixel to solve by hand.</p>
<div class="row ptabs" role="tablist" id="ptabs">
  <button role="tab" aria-selected="true" data-p="linear">Linear filters</button>
  <button role="tab" aria-selected="false" data-p="nonlinear">Non-linear filters</button>
</div>
<div id="linear"></div>
<div id="nonlinear" hidden></div>
</main>

<script>
/* Teacher: edit the two IMAGE arrays (any size, at least 3×3). Keep every value above 0 in the non-linear image. */
const GROUPS={
  linear:{
    keys:['mean','gaussian','sobel','laplacian'],
    image:[[12,40,200,35,90],[60,150,80,220,30],[25,180,100,45,160],[75,20,130,90,55],[210,65,35,140,10]],
    example:[[10,20,30],[20,100,40],[30,40,50]],
    interior:false,
    intro:'Each example filters the center pixel (100). All kernels are 3×3 and the image border is padded with zeros.',
    rule:'Use zero padding and round to the nearest whole number.'
  },
  nonlinear:{
    keys:['harmonic','contraharmonic','geometric','median','max','min','midpoint'],
    image:[[52,60,255,58,61],[55,5,63,59,255],[54,57,60,5,62],[255,58,61,59,57],[53,56,5,60,255]],
    example:[[52,55,57],[54,255,60],[53,58,59]],
    interior:true,
    intro:'Each example filters the center pixel (255), a bright "salt" noise pixel, using its 3×3 neighborhood.',
    rule:'Your 3×3 window lies fully inside the image, so no padding is needed. Round to the nearest whole number.'
  }
};
const sum=a=>a.reduce((s,x)=>s+x,0);
const f4=n=>Number.isInteger(n)?String(n):n.toFixed(4);
const FILTERS={
  mean:{name:'Mean',kind:'conv',k:[[1,1,1],[1,1,1],[1,1,1]],div:9},
  gaussian:{name:'Gaussian',kind:'conv',k:[[1,2,1],[2,4,2],[1,2,1]],div:16},
  sobel:{name:'Sobel',kind:'sobel',kx:[[-1,0,1],[-2,0,2],[-1,0,1]],ky:[[1,2,1],[0,0,0],[-1,-2,-1]]},
  laplacian:{name:'Laplacian',kind:'conv',k:[[0,1,0],[1,-4,1],[0,1,0]],div:1},
  harmonic:{name:'Harmonic',kind:'stat',run(v){
    const inv=sum(v.map(x=>1/x)),r=v.length/inv;
    return {v:r,lines:['Σ(1/x) = '+v.map(x=>'1/'+x).join(' + ')+' = '+inv.toFixed(4),'H = n ÷ Σ(1/x) = '+v.length+' ÷ '+inv.toFixed(4)+' = '+r.toFixed(2)]};}},
  contraharmonic:{name:'Contraharmonic',kind:'stat',run(v,Q){
    const nu=v.map(x=>Math.pow(x,Q+1)),de=v.map(x=>Math.pow(x,Q)),N=sum(nu),D=sum(de),r=N/D;
    return {v:r,lines:['Numerator Σx^'+(Q+1)+' = '+nu.map(f4).join(' + ')+' = '+f4(N),'Denominator Σx^'+Q+' = '+de.map(f4).join(' + ')+' = '+f4(D),'C = '+f4(N)+' ÷ '+f4(D)+' = '+r.toFixed(2)]};}},
  geometric:{name:'Geometric mean',kind:'stat',run(v){
    const pr=v.reduce((a,x)=>a*x,1),r=Math.pow(pr,1/v.length);
    return {v:r,lines:['Product = '+v.join('×')+' = '+(pr<1e15?pr:pr.toExponential(3)),'G = product^(1/'+v.length+') = '+r.toFixed(2)]};}},
  median:{name:'Median',kind:'stat',run(v){
    const s=v.slice().sort((a,b)=>a-b);
    return {v:s[4],lines:['Sorted: '+s.join(', '),'The middle (5th) value is <b>'+s[4]+'</b>']};}},
  max:{name:'Max',kind:'stat',run(v){const m=Math.max(...v);return {v:m,lines:['Largest value in the window = <b>'+m+'</b>']};}},
  min:{name:'Min',kind:'stat',run(v){const m=Math.min(...v);return {v:m,lines:['Smallest value in the window = <b>'+m+'</b>']};}},
  midpoint:{name:'Midpoint',kind:'stat',run(v){
    const a=Math.max(...v),b=Math.min(...v),r=(a+b)/2;
    return {v:r,lines:['Max = '+a+', Min = '+b,'Midpoint = ('+a+' + '+b+') ÷ 2 = '+r.toFixed(2)]};}}
};
const S='<sub>(s,t)∈S</sub>';
const EQ={
  harmonic:()=>'f̂(x,y) = mn ÷ Σ'+S+' [ 1 / g(s,t) ]',
  contraharmonic:Q=>'f̂(x,y) = Σ'+S+' g(s,t)<sup>Q+1</sup> ÷ Σ'+S+' g(s,t)<sup>Q</sup> &nbsp;&nbsp;(here Q = '+Q+')',
  geometric:()=>'f̂(x,y) = [ Π'+S+' g(s,t) ]<sup>1/mn</sup>',
  median:()=>'f̂(x,y) = median'+S+' { g(s,t) }',
  max:()=>'f̂(x,y) = max'+S+' { g(s,t) }',
  min:()=>'f̂(x,y) = min'+S+' { g(s,t) }',
  midpoint:()=>'f̂(x,y) = ½ [ max'+S+' { g(s,t) } + min'+S+' { g(s,t) } ]'
};
const EQ_NOTE='S = the 3×3 window around (x, y), g(s,t) = a pixel value in S, mn = 9 (number of pixels in S), f̂(x,y) = the filtered output.';
const Q_CHOICES=[-2,1,2];
const p=v=>v<0?'('+v+')':v;
const title=(key,Q)=>FILTERS[key].name+(key==='contraharmonic'?' (Q = '+Q+')':'');

function windowAt(img,r,c){
  const w=[],pad=[];
  for(let i=-1;i<=1;i++){
    const row=[],prow=[];
    for(let j=-1;j<=1;j++){
      const inside=img[r+i]&&img[r+i][c+j]!==undefined;
      row.push(inside?img[r+i][c+j]:0);prow.push(!inside);
    }
    w.push(row);pad.push(prow);
  }
  return {w,pad};
}
function table(M,pad,center){
  return '<table class="mat">'+M.map((row,i)=>'<tr>'+row.map((v,j)=>{
    const cls=(center&&i==1&&j==1?'c':'')+(pad&&pad[i][j]?' pad':'');
    return '<td class="'+cls+'">'+v+'</td>';
  }).join('')+'</tr>').join('')+'</table>';
}
function dot(w,k){
  let s=0,terms=[];
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){s+=w[i][j]*k[i][j];terms.push(w[i][j]+'×'+p(k[i][j]));}
  return {s,expr:terms.join(' + ')};
}
function solve(key,win,Q){
  const f=FILTERS[key],w=win.w,padded=win.pad.some(r=>r.some(Boolean));
  let html='<div class="mats"><div><p class="cap">Window'+(padded?' (gray = padding)':'')+'</p>'+table(w,win.pad,true)+'</div>';
  let answer;
  if(f.kind==='sobel'){
    html+='<div><p class="cap">Kx</p>'+table(f.kx)+'</div><div><p class="cap">Ky</p>'+table(f.ky)+'</div></div>';
    const gx=dot(w,f.kx),gy=dot(w,f.ky),g=Math.sqrt(gx.s*gx.s+gy.s*gy.s);
    answer=Math.round(g);
    html+='<div class="calc">Gx = '+gx.expr+' = <b>'+gx.s+'</b></div>'
      +'<div class="calc">Gy = '+gy.expr+' = <b>'+gy.s+'</b></div>'
      +'<div class="calc">G = √(Gx² + Gy²) = √('+gx.s*gx.s+' + '+gy.s*gy.s+') = '+g.toFixed(2)+'</div>';
  }else if(f.kind==='conv'){
    html+='<div><p class="cap">Kernel'+(f.div>1?' (× 1/'+f.div+')':'')+'</p>'+table(f.k)+'</div></div>';
    const d=dot(w,f.k);
    html+='<div class="calc">Sum = '+d.expr+' = <b>'+d.s+'</b></div>';
    if(f.div>1){
      const v=d.s/f.div;answer=Math.round(v);
      html+='<div class="calc">'+d.s+' ÷ '+f.div+' = '+v.toFixed(2)+'</div>';
    }else{
      answer=d.s;
      html+='<div class="calc">The Laplacian output is the sum itself. Negative values are kept.</div>';
    }
  }else{
    html+='</div>';
    html+='<div class="calc eq">'+EQ[key](Q)+'</div><p class="eqnote">'+EQ_NOTE+'</p>';
    const r=f.run(w.flat(),Q);
    answer=Math.round(r.v);
    html+=r.lines.map(l=>'<div class="calc">'+l+'</div>').join('');
  }
  html+='<p>Result: <span class="ans">'+answer+'</span></p>';
  return {html,answer};
}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* UI */
function buildPanel(id){
  const cfg=GROUPS[id],root=document.getElementById(id),$=s=>root.querySelector(s);
  root.innerHTML=
   '<section><h2>Worked examples</h2><p class="mute">'+cfg.intro+'</p><div class="row tabs"></div><div class="exout"></div></section>'
  +'<section><h2>Your pixel</h2><p>Enter your student ID. You will always get the same pixel and filter for the same ID.</p>'
  +'<div class="row"><input class="sid" placeholder="20231234" autocomplete="off" aria-label="Student ID"><button class="go start">Get my pixel</button></div>'
  +'<div class="task" hidden><div class="mats"><div><p class="cap">Image (your pixel is highlighted)</p><div class="img"></div></div></div><p class="desc"></p>'
  +'<div class="row"><input class="user-answer" type="text" inputmode="decimal" placeholder="Your answer" aria-label="Your answer"><button class="check">Check answer</button></div>'
  +'<div class="msg" role="status"></div></div></section>';

  const tabs=$('.tabs');
  tabs.innerHTML=cfg.keys.map(k=>'<button data-k="'+k+'">'+FILTERS[k].name+'</button>').join('');
  function showExample(key){
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
    $('.exout').innerHTML='<h3>'+title(key,1)+' filter on the center pixel</h3>'+solve(key,windowAt(cfg.example,1,1),1).html;
  }
  tabs.addEventListener('click',e=>{if(e.target.dataset.k)showExample(e.target.dataset.k)});
  showExample(cfg.keys[0]);

  let answer=null;
  $('.start').addEventListener('click',()=>{
    const sid=$('.sid'),v=sid.value.trim().toLowerCase();
    if(!v){sid.focus();sid.placeholder='Enter your ID first';return}
    const rnd=rng(hash(id+':'+v)),lo=cfg.interior?1:0,img=cfg.image;
    const r=lo+Math.floor(rnd()*(img.length-2*lo)),c=lo+Math.floor(rnd()*(img[0].length-2*lo));
    const key=cfg.keys[Math.floor(rnd()*cfg.keys.length)],Q=Q_CHOICES[Math.floor(rnd()*Q_CHOICES.length)];
    answer=solve(key,windowAt(img,r,c),Q).answer;
    $('.img').innerHTML='<table class="mat">'+img.map((row,i)=>'<tr>'+row.map((x,j)=>'<td class="'+(i==r&&j==c?'c':'')+'">'+x+'</td>').join('')+'</tr>').join('')+'</table>';
    $('.desc').innerHTML='Apply the <b>'+title(key,Q)+'</b> filter to the pixel in <b>row '+(r+1)+', column '+(c+1)+'</b> (value '+img[r][c]+'). '+cfg.rule;
    $('.task').hidden=false;$('.msg').textContent='';$('.user-answer').value='';
  });
  $('.check').addEventListener('click',()=>{
    const m=$('.msg');
    if(answer===null)return;
    const v=parseFloat($('.user-answer').value.replace(',','.'));
    if(isNaN(v)){m.className='msg no';m.textContent='Enter a number first.';return}
    const ok=Math.abs(v-answer)<=0.5;
    m.className='msg '+(ok?'ok':'no');
    m.textContent=ok?'Correct ✓':'Not quite ✗ Check the window values and the formula.';
  });
  $('.user-answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('.check').click()});
  $('.sid').addEventListener('keydown',e=>{if(e.key==='Enter')$('.start').click()});
}
buildPanel('linear');buildPanel('nonlinear');
document.getElementById('ptabs').addEventListener('click',e=>{
  const id=e.target.dataset.p;if(!id)return;
  document.querySelectorAll('#ptabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===id));
  ['linear','nonlinear'].forEach(g=>document.getElementById(g).hidden=g!==id);
});
</script>
</body>
</html>
